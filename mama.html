<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fomu ya Usajili</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .form-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Jaza Taarifa Zako</h2>
    <form action="#" method="POST">
      <div class="form-group">
        <label for="jina">Jina Kamili:</label>
        <input type="text" id="jina" name="jina" placeholder="Mfano: Juma Kassim" required>
      </div>

      <div class="form-group">
        <label for="email">Barua Pepe (Email):</label>
        <input type="email" id="email" name="email" placeholder="mfano@email.com" required>
      </div>

      <div class="form-group">
        <label for="ujumbe">Ujumbe:</label>
        <textarea id="ujumbe" name="ujumbe" rows="4" placeholder="Andika ujumbe wako hapa..."></textarea>
      </div>

      <button type="submit">Tuma Taarifa</button>
    </form>
  </div>

</body>
</html>
